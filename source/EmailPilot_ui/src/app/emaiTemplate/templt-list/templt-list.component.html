<div class="container">
  <h2 class="header">Email Template List</h2>
  <div class="header">
    <button mat-button color="primary" (click)="openAddTemplateDialog()">➕ Add New Template</button>
  </div>

  <table mat-table [dataSource]="templateGrp" class="mat-elevation-z8">
    <!-- Template ID Column -->
    <ng-container matColumnDef="mlCntntId">
      <th mat-header-cell *matHeaderCellDef> Template ID </th>
      <td mat-cell *matCellDef="let template"> {{ template.mlCntntId }} </td>
    </ng-container>

    <!-- Title Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef> Title </th>
      <td mat-cell *matCellDef="let template"> {{ template.title }} </td>
    </ng-container>

    <!-- Subject Column -->
    <ng-container matColumnDef="subject">
      <th mat-header-cell *matHeaderCellDef> Subject </th>
      <td mat-cell *matCellDef="let template"> {{ template.subject }} </td>
    </ng-container>

    <!-- Created At Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef> Created At </th>
      <td mat-cell *matCellDef="let template"> {{ template.addTm | date:'short' }} </td>
    </ng-container>

    <!-- Updated At Column -->
    <ng-container matColumnDef="updatedAt">
      <th mat-header-cell *matHeaderCellDef> Updated At </th>
      <td mat-cell *matCellDef="let template"> {{ template.uptTm | date:'short' }} </td>
    </ng-container>

    <!-- ✅ Actions Column (Edit, View, Delete) -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let template">
        <!-- Edit Button -->
        <button mat-icon-button color="primary" (click)="editTemplate(template)">
          <mat-icon>edit</mat-icon>
        </button>
        <!-- View Button -->
        <button mat-icon-button color="accent" (click)="viewTemplate(template)">
          <mat-icon>visibility</mat-icon>
        </button>
        <!-- Delete Button -->
        <button mat-icon-button color="warn" (click)="deleteTemplate(template.mlCntntId)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['mlCntntId', 'title', 'subject', 'createdAt', 'updatedAt', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['mlCntntId', 'title', 'subject', 'createdAt', 'updatedAt', 'actions'];"></tr>
  </table>

  <!-- ✅ Paginator -->
  <mat-paginator [length]="totalEmails" [pageSize]="itemsPerPage" (page)="onPageChange($event.pageIndex + 1)">
  </mat-paginator>
</div>

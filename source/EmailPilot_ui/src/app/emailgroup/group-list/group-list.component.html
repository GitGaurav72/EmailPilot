<div class="container">
  <h2 class="header">Email Groups List</h2>
  <div class="header">
    <button mat-button color="primary" (click)="openAddEmailGroupDialog()">➕ Add New Email Group</button>
    <input type="file" (change)="onFileUpload($event, 'excel')" accept=".xlsx, .xls" hidden #excelUpload />
    <button mat-button color="accent" (click)="excelUpload.click()">📂 Upload Excel</button>
    
    <input type="file" (change)="onFileUpload($event, 'pdf')" accept=".pdf" hidden #pdfUpload />
    <button mat-button color="warn" (click)="pdfUpload.click()">📄 Upload PDF</button>
  </div>

  <table mat-table [dataSource]="emailGroup" class="mat-elevation-z8">
    <ng-container matColumnDef="groupId">
      <th mat-header-cell *matHeaderCellDef> Group ID </th>
      <td mat-cell *matCellDef="let email"> {{ email.mGrpId }} </td>
    </ng-container>

    <ng-container matColumnDef="grpname">
      <th mat-header-cell *matHeaderCellDef> Group Name </th>
      <td mat-cell *matCellDef="let email"> {{ email.mGrpNm }} </td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef> Created At </th>
      <td mat-cell *matCellDef="let email"> {{ email.addTs | date:'short' }} </td>
    </ng-container>

    <ng-container matColumnDef="updatedAt">
      <th mat-header-cell *matHeaderCellDef> Updated At </th>
      <td mat-cell *matCellDef="let email"> {{ email.updtTs | date:'short' }} </td>
    </ng-container>

    <!-- ✅ Action Buttons (Edit, View, Delete) -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let email">
        <button mat-icon-button color="primary" (click)="editEmailGroup(email)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="accent" (click)="viewEmailGroup(email)">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteEmailGroup(email.mGrpId)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['groupId', 'grpname', 'createdAt', 'updatedAt', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['groupId', 'grpname', 'createdAt', 'updatedAt', 'actions'];"></tr>
  </table>

  <mat-paginator [length]="totalEmails" [pageSize]="itemsPerPage" (page)="onPageChange($event.pageIndex + 1)">
  </mat-paginator>
</div>
